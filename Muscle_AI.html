<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>Muscle AI</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card: #1e293b;
      --accent: #38bdf8;
      --text: #f8fafc;
      --muted: #94a3b8;
      --danger: #ef4444;
    }
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding-bottom: 70px;
    }
    header {
      padding: 16px;
      background: var(--card);
      border-bottom: 1px solid #334155;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    h1, h2, h3 { margin: 0; }
    .container { padding: 15px; max-width: 600px; margin: 0 auto; }
    .card {
      background: var(--card);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    .warmup-card {
      border-left: 4px solid var(--accent);
      background: #172554;
    }
    .mode-toggle {
      display: flex;
      background: #334155;
      border-radius: 8px;
      padding: 4px;
    }
    .mode-btn {
      flex: 1;
      border: none;
      background: transparent;
      color: var(--muted);
      padding: 8px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    .mode-btn.active {
      background: var(--accent);
      color: #0f172a;
    }
    .day-selector {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 12px;
    }
    .day-btn {
      background: #334155;
      color: var(--muted);
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
    }
    .day-btn.active {
      background: var(--accent);
      color: #0f172a;
    }
    .exercise-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #334155;
    }
    .exercise-item:last-child { border-bottom: none; }
    input[type="number"], input[type="text"] {
      background: #0f172a;
      border: 1px solid #334155;
      color: #fff;
      padding: 8px;
      border-radius: 6px;
      width: 60px;
    }
    button.action-btn {
      background: var(--accent);
      color: #0f172a;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
    button.delete-btn {
      background: var(--danger);
      color: #fff;
      border: none;
      padding: 6px 10px;
      border-radius: 6px;
      cursor: pointer;
    }
    .nav {
      position: fixed;
      bottom: 0;
      width: 100%;
      background: var(--card);
      display: flex;
      border-top: 1px solid #334155;
    }
    .nav-btn {
      flex: 1;
      padding: 12px;
      background: none;
      border: none;
      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
      text-align: center;
    }
    .nav-btn.active { color: var(--accent); font-weight: bold; }
    .page { display: none; }
    .page.active { display: block; }
    .recipe-details {
      display: none;
      margin-top: 8px;
      padding: 10px;
      background: #0f172a;
      border-radius: 6px;
      font-size: 14px;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <header>
    <h1>Muscle AI</h1>
    <div class="mode-toggle">
      <button class="mode-btn active" id="btn-home" onclick="setMode('home')">Home</button>
      <button class="mode-btn" id="btn-gym" onclick="setMode('gym')">Gym</button>
    </div>
  </header>

  <div class="container">
    <!-- WORKOUT PAGE -->
    <div id="page-workout" class="page active">
      <div class="day-selector" id="day-buttons"></div>

      <!-- DEFAULT WARM-UP CARD -->
      <div class="card warmup-card">
        <h3 style="color: var(--accent);">🔥 Default Warm-Up (5 Mins)</h3>
        <p style="font-size: 13px; color: var(--text); margin-top: 6px; line-height: 1.5;" id="warmup-text">
          Perform each movement for 45 seconds before starting your main set:
        </p>
        <ul id="warmup-list" style="font-size: 13px; color: #cbd5e1; padding-left: 18px; margin-top: 6px; margin-bottom: 0; line-height: 1.6;">
        </ul>
      </div>

      <div class="card">
        <h3 id="current-day-title">Monday Workouts</h3>
        <div id="exercise-list" style="margin-top: 10px;"></div>
      </div>

      <div class="card">
        <h3>Add Custom Exercise</h3>
        <div style="display: flex; gap: 8px; margin-top: 8px;">
          <input type="text" id="new-ex-name" placeholder="Exercise Name" style="flex: 1;" />
          <button class="action-btn" onclick="addCustomExercise()">Add</button>
        </div>
      </div>
    </div>

    <!-- PROGRESS PAGE -->
    <div id="page-progress" class="page">
      <div class="card">
        <h2>Strength Progression</h2>
        <p style="font-size: 12px; color: var(--muted); margin-top: 4px;">Track your volume over time.</p>
        <canvas id="progressChart" style="width:100%; max-height:250px; margin-top:10px;"></canvas>
      </div>
    </div>

    <!-- MEALS PAGE -->
    <div id="page-meals" class="page">
      <div class="card">
        <h2>30 High-Protein Meals & Snacks</h2>
        <div id="meal-list" style="margin-top: 12px;"></div>
      </div>
    </div>
  </div>

  <nav class="nav">
    <button class="nav-btn active" onclick="switchPage('workout', this)">Workouts</button>
    <button class="nav-btn" onclick="switchPage('progress', this)">Progress</button>
    <button class="nav-btn" onclick="switchPage('meals', this)">Meals</button>
  </nav>

  <script>
    let currentMode = 'home';
    let currentDay = 'Mon';
    const days = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];

    const warmups = {
      home: [
        "Jumping Jacks (60 seconds)",
        "Arm Circles & Hugs (30 sec forward, 30 sec back)",
        "Bodyweight Air Squats (15 reps)",
        "Inchworms to Plank (5 reps)",
        "Wrist & Forearm Circles (30 seconds)"
      ],
      gym: [
        "Light Treadmill Walk / Exercise Bike (3 minutes)",
        "Dynamic Arm Swings & Shoulder Dislocates (1 minute)",
        "Bodyweight Lunge with Overhead Reach (10 total reps)",
        "Leg Swings (10 each side)",
        "1 Light Warm-Up Set of your first exercise (50% normal weight)"
      ]
    };

    const defaultWorkouts = {
      home: {
        Mon: [
          { name: 'Dumbbell Bench Press', weight: 20, reps: 10 },
          { name: 'Push-Ups', weight: 0, reps: 15 },
          { name: 'Dumbbell Shoulder Press', weight: 15, reps: 10 },
          { name: 'Dumbbell Floor Flyes', weight: 15, reps: 12 },
          { name: 'Tricep Bench Dips', weight: 0, reps: 12 },
          { name: 'Hand Gripper Squeezes', weight: 0, reps: 20 },
          { name: 'Plank Hold (seconds)', weight: 0, reps: 45 }
        ],
        Tue: [
          { name: 'Goblet Squats', weight: 25, reps: 12 },

          { name: 'Dumbbell Lunges', weight: 15, reps: 10 },
          { name: 'Calf Raises', weight: 25, reps: 20 },
          { name: 'Glute Bridges', weight: 0, reps: 15 },

        ],
        Wed: [

          { name: 'Hammer Curls', weight: 15, reps: 10 },

          { name: 'Bodyweight Inverted Rows', weight: 0, reps: 8 },
          { name: 'Hand Gripper Squeezes', weight: 0, reps: 20 }
        ],
        Thu: [
          { name: 'Push-Ups (Slow Tempo)', weight: 0, reps: 12 },
          { name: 'Dumbbell Arnold Press', weight: 15, reps: 10 },
          { name: 'Dumbbell Overhead Tricep Ext', weight: 20, reps: 10 },
          { name: 'Floor Crunch', weight: 0, reps: 20 },
          { name: 'Leg Raises on Bench', weight: 0, reps: 15 },
          { name: 'Hand Gripper Squeezes', weight: 0, reps: 20 }
        ],
        Fri: [
          { name: 'Dumbbell Step-Ups', weight: 15, reps: 10 },
          { name: 'Dumbbell Sumo Squats', weight: 25, reps: 12 },
          { name: 'Bulgarian Split Squats', weight: 10, reps: 8 },
          { name: 'Standing Calf Raises', weight: 20, reps: 15 },
          { name: 'Side Planks (seconds)', weight: 0, reps: 30 }
        ],
        Sat: [
          { name: 'Dumbbell Chest Press on Bench', weight: 20, reps: 12 },
          { name: 'Bent-Over Dumbbell Rows', weight: 20, reps: 10 },
          { name: 'Dumbbell Lateral Raises', weight: 10, reps: 12 },
          { name: 'Concentration Curls', weight: 15, reps: 10 },
          { name: 'Diamond Push-Ups', weight: 0, reps: 10 },
          { name: 'Hand Gripper Squeezes', weight: 0, reps: 20 }
        ],
        Sun: [
          { name: 'Light Bodyweight Squats', weight: 0, reps: 15 },
          { name: 'Cat-Cow Stretch (Reps)', weight: 0, reps: 10 },
          { name: 'Full Body Mobility Routine', weight: 0, reps: 1 }
        ]
      },
      gym: {
        Mon: [
          { name: 'Barbell Bench Press', weight: 65, reps: 8 },
          { name: 'Incline Dumbbell Press', weight: 25, reps: 10 },
          { name: 'Cable Chest Flyes', weight: 20, reps: 12 },
          { name: 'Tricep Rope Pushdowns', weight: 30, reps: 12 },
          { name: 'Overhead Cable Extensions', weight: 25, reps: 10 },
          { name: 'Pool Laps (Laps)', weight: 0, reps: 10 },
          { name: 'Hanging Leg Raises', weight: 0, reps: 12 }
        ],
        Tue: [
          { name: 'Barbell Squats', weight: 75, reps: 8 },
          { name: 'Leg Press Machine', weight: 120, reps: 10 },
          { name: 'Hamstring Leg Curls', weight: 50, reps: 12 },
          { name: 'Leg Extension Machine', weight: 60, reps: 12 },
          { name: 'Seated Calf Raises', weight: 45, reps: 15 },
          { name: 'Pool Laps (Laps)', weight: 0, reps: 12 }
        ],
        Wed: [
          { name: 'Lat Pulldowns', weight: 70, reps: 10 },
          { name: 'Seated Cable Rows', weight: 65, reps: 10 },
          { name: 'Dumbbell Shrugs', weight: 30, reps: 12 },
          { name: 'EZ-Bar Bicep Curls', weight: 30, reps: 10 },
          { name: 'Face Pulls', weight: 35, reps: 15 },
          { name: 'Pool Laps (Laps)', weight: 0, reps: 10 }
        ],
        Thu: [
          { name: 'Seated Overhead Dumbbell Press', weight: 25, reps: 10 },
          { name: 'Cable Lateral Raises', weight: 10, reps: 12 },
          { name: 'Machine Pec Deck Flyes', weight: 50, reps: 12 },
          { name: 'Skull Crushers', weight: 30, reps: 10 },
          { name: 'Ab Machine Crunches', weight: 40, reps: 15 }
        ],
        Fri: [
          { name: 'Hex Bar Deadlifts', weight: 95, reps: 6 },
          { name: 'Walking Dumbbell Lunges', weight: 20, reps: 10 },
          { name: 'Romanian Deadlifts', weight: 65, reps: 10 },
          { name: 'Standing Calf Raise Machine', weight: 80, reps: 12 },
          { name: 'Pool Laps (Laps)', weight: 0, reps: 15 }
        ],
        Sat: [
          { name: 'Incline Barbell Bench Press', weight: 55, reps: 8 },
          { name: 'Assisted Pull-Ups', weight: 40, reps: 10 },
          { name: 'Cable Preacher Curls', weight: 25, reps: 12 },
          { name: 'Dumbbell Hammer Curls', weight: 20, reps: 10 },
          { name: 'Cable Woodchoppers', weight: 20, reps: 12 }
        ],
        Sun: [
          { name: 'Pool Laps (Recovery Laps)', weight: 0, reps: 20 },
          { name: 'Foam Rolling & Stretching', weight: 0, reps: 1 },
          { name: 'Sauna / Light Walk', weight: 0, reps: 1 }
        ]
      }
    };

    let workouts = JSON.parse(localStorage.getItem('muscle_ai_workouts')) || defaultWorkouts;

    let historyLog = JSON.parse(localStorage.getItem('muscle_ai_history')) || [
      { date: 'Week 1', totalVolume: 1200 },
      { date: 'Week 2', totalVolume: 1450 },
      { date: 'Week 3', totalVolume: 1700 }
    ];

    const meals = [
      { title: "1. Greek Yogurt & Berry Parfait (22g Protein)", instructions: "Mix 1 cup plain Greek yogurt with 1 tbsp honey. Top with 1/2 cup blueberries and 2 tbsp sliced almonds." },
      { title: "2. Peanut Butter Banana Oatmeal (18g Protein)", instructions: "Cook 1/2 cup oats in 1 cup milk. Stir in 2 tbsp peanut butter and top with 1 sliced banana." },
      { title: "3. Scrambled Eggs & Cheese Toast (24g Protein)", instructions: "Scramble 3 large eggs. Serve on 2 slices of whole wheat toast topped with 1 slice of cheddar cheese." },
      { title: "4. Grilled Chicken Rice Bowl (38g Protein)", instructions: "Combine 5oz grilled chicken breast, 1 cup cooked brown rice, and 1/2 cup steamed broccoli with soy sauce." },
      { title: "5. Cottage Cheese & Pineapple Bowl (25g Protein)", instructions: "Scoop 1 cup low-fat cottage cheese into a bowl and top with 1/2 cup diced fresh pineapple." },
      { title: "6. Tuna Salad Wrap (30g Protein)", instructions: "Mix 1 can drained tuna with 1 tbsp mayo, salt, and pepper. Wrap in a whole wheat tortilla with lettuce." },
      { title: "7. Chocolate Protein Smoothie (30g Protein)", instructions: "Blend 1 scoop chocolate protein powder, 1 cup milk, 1 banana, and 1 tbsp peanut butter with ice." },
      { title: "8. Turkey & Cheese Roll-Ups (20g Protein)", instructions: "Take 4 slices of deli turkey breast and roll each one around a stick of mozzarella string cheese." },
      { title: "9. Hard-Boiled Eggs & Almonds (18g Protein)", instructions: "Eat 2 hard-boiled eggs paired with a small handful (around 20) of roasted almonds." },
      { title: "10. Beef & Broccoli Stir-Fry (35g Protein)", instructions: "Sauté 4oz lean ground beef with broccoli florets and 1 tbsp teriyaki sauce. Serve over white rice." },
      { title: "11. High-Protein Edamame Bowl (18g Protein)", instructions: "Steam 1.5 cups of shelled edamame pods. Sprinkle with sea salt and sesame seeds." },
      { title: "12. Protein Pancake Stack (28g Protein)", instructions: "Mix 1/2 cup oat flour, 1 scoop vanilla protein powder, 1 egg, and milk. Cook on a skillet like normal pancakes." },
      { title: "13. Black Bean & Cheese Quesadilla (20g Protein)", instructions: "Place 1/2 cup black beans and 1/4 cup shredded cheese inside a tortilla. Fold and toast in a pan." },
      { title: "14. Salmon & Baked Sweet Potato (32g Protein)", instructions: "Bake a 4oz salmon fillet at 400°F for 12 mins. Serve alongside 1 baked sweet potato." },
      { title: "15. Apple Slices with Peanut Butter & Hemp Seeds (12g Protein)", instructions: "Slice 1 medium apple. Dip into 2 tbsp peanut butter sprinkled with 1 tbsp hemp seeds." },
      { title: "16. High-Protein Egg Bites (20g Protein)", instructions: "Whisk 4 eggs, 1/4 cup cottage cheese, and spinach. Pour into a muffin tin and bake at 350°F for 20 mins." },
      { title: "17. Ground Turkey Rice Meal Prep (32g Protein)", instructions: "Brown 4oz lean ground turkey with taco seasoning. Serve over 1 cup jasmine rice with salsa." },
      { title: "18. Protein Rice Krispie Treat Snack (12g Protein)", instructions: "Melt 1 tbsp butter and marshmallows, stir in 1 scoop vanilla protein powder and Rice Krispies cereal." },
      { title: "19. Chia Seed Protein Pudding (16g Protein)", instructions: "Mix 3 tbsp chia seeds, 1 cup protein milk, and vanilla extract. Chill in the fridge overnight." },
      { title: "20. Ham & Swiss Whole Wheat Sandwich (26g Protein)", instructions: "Layer 4 slices of lean deli ham and 1 slice of Swiss cheese between 2 slices of whole grain bread." },
      { title: "21. High-Protein Chocolate Pudding (20g Protein)", instructions: "Mix 3/4 cup Greek yogurt with 1 tbsp cocoa powder, 1 tbsp maple syrup, and 1/2 scoop protein powder." },
      { title: "22. Rotisserie Chicken & Avocado Plate (30g Protein)", instructions: "Shred 4oz store-bought rotisserie chicken breast. Serve with 1/2 sliced avocado and baby carrots." },
      { title: "23. Tofu & Veggie Fry (22g Protein)", instructions: "Cube 6oz firm tofu and pan-fry until crispy. Toss with bell peppers, snap peas, and soy sauce." },
      { title: "24. Chocolate Peanut Butter Oatmeal (22g Protein)", instructions: "Cook 1/2 cup oats, stir in 1/2 scoop chocolate protein powder and 1 tbsp peanut butter." },
      { title: "25. Turkey Jerky & Pumpkin Seeds (20g Protein)", instructions: "Grab 1 serving of low-sodium turkey jerky and pair it with 1/4 cup shelled pumpkin seeds." },
      { title: "26. High-Protein Pasta & Beef Sauce (35g Protein)", instructions: "Boil 1 cup chickpea/protein pasta. Top with warm marinara sauce mixed with 3oz extra-lean ground beef." },
      { title: "27. Egg Salad on Rice Cakes (16g Protein)", instructions: "Mash 2 hard-boiled eggs with 1 tbsp Greek yogurt, mustard, salt, and pepper. Spread onto 2 plain rice cakes." },
      { title: "28. Berry Protein Milkshake (25g Protein)", instructions: "Blend 1 cup high-protein milk (like Fairlife), 1/2 cup frozen strawberries, and 1 scoop vanilla protein powder." },
      { title: "29. Hummus & Pita with Chicken (25g Protein)", instructions: "Slice 3oz grilled chicken strips. Serve with 1 whole wheat pita pocket and 3 tbsp hummus." },
      { title: "30. String Cheese & Turkey Pepperoni Snack (15g Protein)", instructions: "Pair 2 mozzarella string cheese sticks with 12 pieces of turkey pepperoni for a quick bite." }
    ];

    function saveState() {
      localStorage.setItem('muscle_ai_workouts', JSON.stringify(workouts));
      localStorage.setItem('muscle_ai_history', JSON.stringify(historyLog));
    }

    function setMode(mode) {
      currentMode = mode;
      document.getElementById('btn-home').classList.toggle('active', mode === 'home');
      document.getElementById('btn-gym').classList.toggle('active', mode === 'gym');
      renderWarmup();
      renderWorkouts();
    }

    function setDay(day) {
      currentDay = day;
      renderDayButtons();
      renderWorkouts();
    }

    function renderDayButtons() {
      const container = document.getElementById('day-buttons');
      container.innerHTML = '';
      days.forEach(d => {
        const btn = document.createElement('button');
        btn.className = `day-btn ${d === currentDay ? 'active' : ''}`;
        btn.innerText = d;
        btn.onclick = () => setDay(d);
        container.appendChild(btn);
      });
    }

    function renderWarmup() {
      const listContainer = document.getElementById('warmup-list');
      listContainer.innerHTML = '';
      warmups[currentMode].forEach(item => {
        const li = document.createElement('li');
        li.innerText = item;
        listContainer.appendChild(li);
      });
    }

    function renderWorkouts() {
      document.getElementById('current-day-title').innerText = `${currentDay} Workouts (${currentMode.toUpperCase()})`;
      const container = document.getElementById('exercise-list');
      container.innerHTML = '';

      const dayList = workouts[currentMode][currentDay] || [];

      if (dayList.length === 0) {
        container.innerHTML = '<p style="color: var(--muted); font-size: 14px;">No workouts logged for this day.</p>';
        return;
      }

      dayList.forEach((ex, idx) => {
        const item = document.createElement('div');
        item.className = 'exercise-item';
        item.innerHTML = `
          <div>
            <strong>${ex.name}</strong>
            <div style="font-size: 12px; color: var(--muted); margin-top: 4px;">
              Weight: <input type="number" value="${ex.weight}" onchange="updateEx(${idx}, 'weight', this.value)"> lbs |
              Reps: <input type="number" value="${ex.reps}" onchange="updateEx(${idx}, 'reps', this.value)">
            </div>
          </div>
          <button class="delete-btn" onclick="deleteExercise(${idx})">X</button>
        `;
        container.appendChild(item);
      });
    }

    function updateEx(index, key, val) {
      workouts[currentMode][currentDay][index][key] = Number(val);
      saveState();
    }

    function addCustomExercise() {
      const nameInput = document.getElementById('new-ex-name');
      if (!nameInput.value.trim()) return;
      if (!workouts[currentMode][currentDay]) workouts[currentMode][currentDay] = [];

      workouts[currentMode][currentDay].push({
        name: nameInput.value.trim(),
        weight: 10,
        reps: 10
      });
      nameInput.value = '';
      saveState();
      renderWorkouts();
    }

    function deleteExercise(index) {
      workouts[currentMode][currentDay].splice(index, 1);
      saveState();
      renderWorkouts();
    }

    function renderMeals() {
      const container = document.getElementById('meal-list');
      container.innerHTML = '';
      meals.forEach((m, i) => {
        const div = document.createElement('div');
        div.style.marginBottom = '12px';
        div.innerHTML = `
          <div style="cursor: pointer; font-weight: bold; color: var(--accent);" onclick="toggleMeal(${i})">
            ${m.title}
          </div>
          <div id="meal-${i}" class="recipe-details">
            <strong>How to make:</strong> ${m.instructions}
          </div>
        `;
        container.appendChild(div);
      });
    }

    function toggleMeal(idx) {
      const el = document.getElementById(`meal-${idx}`);
      el.style.display = el.style.display === 'block' ? 'none' : 'block';
    }

    function switchPage(pageId, btn) {
      document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById(`page-${pageId}`).classList.add('active');
      btn.classList.add('active');
      if (pageId === 'progress') renderChart();
    }

    let chartInstance = null;
    function renderChart() {
      const ctx = document.getElementById('progressChart').getContext('2d');
      if (chartInstance) chartInstance.destroy();

      chartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: historyLog.map(h => h.date),
          datasets: [{
            label: 'Total Volume Lifted (lbs)',
            data: historyLog.map(h => h.totalVolume),
            borderColor: '#38bdf8',
            backgroundColor: 'rgba(56, 189, 248, 0.1)',
            tension: 0.3,
            fill: true
          }]
        },
        options: {
          scales: {
            y: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' } },
            x: { grid: { color: '#334155' }, ticks: { color: '#94a3b8' } }
          },
          plugins: { legend: { labels: { color: '#f8fafc' } } }
        }
      });
    }

    // Initial Setup
    renderDayButtons();
    renderWarmup();
    renderWorkouts();
    renderMeals();
  </script>
</body>
</html>
